version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    # These major versions drop the supported Node.js 20 runtime.
    ignore:
      - dependency-name: chalk
        versions: [">=6"]
      - dependency-name: commander
        versions: [">=15"]
      - dependency-name: vitest
        versions: [">=5"]
      - dependency-name: "@vitest/coverage-v8"
        versions: [">=5"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
