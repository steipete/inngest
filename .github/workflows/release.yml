name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: SemVer to release or rehearse
        required: true
        type: string
      dry_run:
        description: Build and verify without publishing
        default: true
        type: boolean

permissions: {}

jobs:
  release:
    permissions:
      actions: read
      checks: read
      contents: write
      statuses: read
      id-token: write
    uses: openclaw/release-workflows/.github/workflows/release-npm-package.yml@v1
    with:
      version: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      node-version: "24"
      package-manager: pnpm
      package-manager-version: "10.34.5"
      build-command: pnpm build
      test-command: pnpm check && pnpm test:smoke
      smoke-command: >-
        node -e 'const assert = require("node:assert/strict");
        const { execFileSync } = require("node:child_process");
        const pkg = require("@steipete/inngest/package.json");
        assert.equal(execFileSync("./node_modules/.bin/inngest", ["--version"], { encoding: "utf8" }).trim(), pkg.version);
        execFileSync("./node_modules/.bin/inngest", ["--help"], { stdio: "inherit" });'
      ci-check-events: '["push"]'
      strict-checks: true
